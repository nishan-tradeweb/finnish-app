# Run once:  Actions > "Make Android key" > Run workflow.
# Needs the GitHub secret ANDROID_KEYSTORE_PASSWORD (a long password you invent, 20+ characters). Keep that password safe forever.
# It creates your Android signing key, locks it with that password and stores the locked copy in the repository (keystore/finnish-release.jks.enc).
# The run summary shows the SHA-1 you paste into Google Cloud when you create the Android OAuth client.
name: Make Android key

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    env:
      PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the key (only if there is none yet)
        run: |
          [ -n "$PW" ] || { echo "Add the secret ANDROID_KEYSTORE_PASSWORD first."; exit 1; }
          [ ${#PW} -ge 16 ] || { echo "The password is too short. Use 20 or more characters."; exit 1; }
          if [ -f keystore/finnish-release.jks.enc ]; then
            echo "A key already exists. Nothing was changed."
          else
            mkdir -p keystore
            keytool -genkeypair -keystore "$RUNNER_TEMP/ks.jks" -storetype PKCS12 -storepass "$PW" -keypass "$PW" -alias finnish -dname "CN=finnish, O=finnish, C=IN" -keyalg RSA -keysize 2048 -validity 10000
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$RUNNER_TEMP/ks.jks" -out keystore/finnish-release.jks.enc -pass env:PW
            git config user.name "finnish build"; git config user.email "build@users.noreply.github.com"
            git add keystore/finnish-release.jks.enc
            git commit -m "Add locked Android signing key"
            git push
          fi
      - name: Show the SHA-1
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keystore/finnish-release.jks.enc -out "$RUNNER_TEMP/ks.jks" -pass env:PW
          S=$(keytool -list -v -keystore "$RUNNER_TEMP/ks.jks" -alias finnish -storepass "$PW" | grep "SHA1:" | head -n1 | sed 's/.*SHA1: *//')
          echo "SHA-1: $S"
          { echo "### Android key ready"; echo; echo "SHA-1 (copy this into Google Cloud):"; echo; echo "\`$S\`"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Backup copy (locked file)
        uses: actions/upload-artifact@v4
        with:
          name: finnish-android-key-backup
          path: keystore/finnish-release.jks.enc
          retention-days: 90
