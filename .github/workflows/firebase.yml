# Run after the Firebase and Google steps:  Actions > "Deploy finnish server" > Run workflow.
# It publishes the server code (status, deleteMe, verifyPlay) and the database rules to your Firebase project, using the GitHub secrets
#   FIREBASE_SERVICE_ACCOUNT  (the full JSON key of a service account with the Owner role; delete that key in Google Cloud after the deploy)
#   FIREBASE_PROJECT_ID       (e.g. finnish-writer)
#   FIREBASE_REGION           (optional: only if the database/functions region is not us-central1, e.g. asia-south1)
#   PROXYCHECK_KEY            (optional: VPN check key from proxycheck.io)
name: Deploy finnish server

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract finnish-app.zip
        run: |
          test -f finnish-app.zip || { echo "finnish-app.zip not found in the repository root"; exit 1; }
          rm -rf app && mkdir app && unzip -q finnish-app.zip -d app
          if [ ! -f app/package.json ]; then inner=$(find app -maxdepth 2 -name package.json | head -n1 | xargs -r dirname); [ -n "$inner" ] || { echo "package.json not found in the zip"; exit 1; }; mv "$inner"/* "$inner"/.[!.]* app/ 2>/dev/null || true; fi
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy to Firebase
        working-directory: app/firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          REGION: ${{ secrets.FIREBASE_REGION }}
          PCK: ${{ secrets.PROXYCHECK_KEY }}
        run: |
          [ -n "$SA" ] && [ -n "$PROJECT" ] || { echo "Add the secrets FIREBASE_SERVICE_ACCOUNT and FIREBASE_PROJECT_ID first."; exit 1; }
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '{"projects":{"default":"%s"}}' "$PROJECT" > .firebaserc
          : > functions/.env
          [ -n "$REGION" ] && echo "FUNCTIONS_REGION=$REGION" >> functions/.env
          [ -n "$PCK" ] && echo "PROXYCHECK_KEY=$PCK" >> functions/.env
          (cd functions && npm install --no-audit --no-fund)
          npx --yes firebase-tools@13 deploy --only firestore:rules,functions --project "$PROJECT" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
